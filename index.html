    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
    <title>Pacman</title>
    <link rel="icon" type="image/x-icon" href="favicon.png">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(180deg, #181822 0%, #3f1235 100%);
        }

        canvas {
            display: block;
        }

        .score__container {
            position: absolute;
            top: 10px;
            left: 50%;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 20px;
            transform: translateX(-50%);
            height: min-content;
        }

        .score__container>div {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .score__container p {
            font-family: "Jersey 10", sans-serif;
            font-weight: 400;
            font-style: normal;
            color: #FFC300;
            text-align: center;
            font-size: 1.5rem;
            margin: 0rem;
        }

        #score {
            font-size: 4rem;
            margin: 0rem;
        }



        .button__container {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 0.5rem;
        }

        button {
            background-color: #FFC300;
            aspect-ratio: 1/1;
            display: grid;
            place-content: center;
            border: none;
            border-radius: 5px;
            width: 3rem;

            cursor: pointer;
        }

        button:hover {
            background-color: #f89900;
        }

        #myPopover {
            background-color: #0d0b15;
            border: none;
            border-radius: 10px;
            padding: 1rem;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        .popover__content {
            width: 30rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: "Jersey 10", sans-serif;
            font-weight: 400;
            font-style: normal;
            color: #FFC300;
            text-align: center;
            font-size: 1.5rem;
            margin: 0rem;
            text-wrap: balance;
        }

        .popover__content>video {
            width: 80%;
        }
    </style>

  <script type="module" crossorigin src="/pacman/assets/index-A4aWzm88.js"></script>
</head>
